<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LUiv</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="login-page">


    <main class="login-container">


        <div class="login-brand">

            <div class="login-logo">
                LU<span>iv</span>
            </div>

            <p class="login-subtitle">
                Gestión inteligente para tu negocio
            </p>

        </div>


        <div class="login-card">

            <span class="login-eyebrow">
                ACCESO
            </span>

            <h1>
                Entrá a tu negocio
            </h1>

            <p>
                Accedé a tu panel de gestión
                y consultá toda la información
                de tu negocio.
            </p>


            <button
                class="login-button"
                onclick="entrarAlNegocio()"
            >
                Entrar a mi negocio
            </button>

        </div>


        <p class="login-footer">
            LUiv · Gestión simple y clara
        </p>


    </main>


    <script>

        function entrarAlNegocio() {

            window.location.href = "dashboard.html";

        }

    </script>


</body>

</html>
